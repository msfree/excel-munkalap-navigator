<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munkalap-navigátor</title><link rel="stylesheet" href="taskpane.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer src="taskpane.js"></script></head><body><header><div class="title"><h1>Munkalap-navigátor <small>v1.1</small></h1><button id="refresh" title="Lista frissítése" aria-label="Frissítés">↻</button></div><p id="status" role="status">Excel kapcsolódás…</p></header><main><input id="search" type="search" placeholder="Munkalap keresése…" aria-label="Munkalap keresése"><div class="toolbar"><span id="count"></span><div class="tools"><button id="compact" title="Kompakt nézet" aria-pressed="true">≡</button><button id="smaller" title="Kisebb betű">A−</button><button id="larger" title="Nagyobb betű">A+</button></div></div><div class="options"><label><input type="checkbox" id="grouping"> Csoportosítás</label><select id="groupMode" aria-label="Csoportosítás módja"><option value="color">Fülszín</option><option value="prefix">Névelőtag</option></select><label><input type="checkbox" id="showHidden" checked> Rejtettek</label></div><div id="sheets" class="sheetlist" aria-label="Munkalapok"></div></main><footer>A kedvencek és a nézetbeállítások ezen a gépen, a bővítmény helyi tárolójában maradnak. Cellatartalmat nem olvasunk.</footer></body></html>
